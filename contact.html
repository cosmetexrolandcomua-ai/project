<!DOCTYPE html>
<html lang="uk" data-chrome="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контакти — Nymphai Cosmetics</title>
<meta name="description" content="Зв’яжіться з Nymphai Cosmetics щодо лінії Dafne або замовлення.">
<meta name="theme-color" content="#EFE9DD">
<link rel="icon" href="assets/img/brand/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Контакти — Nymphai Cosmetics">
<meta property="og:description" content="Зв’яжіться з Nymphai Cosmetics щодо лінії Dafne або замовлення.">
<meta property="og:locale" content="uk_UA">
<meta property="og:locale:alternate" content="en_GB">
<meta property="og:image" content="assets/img/scenes/still-linea.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/chrome.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>

<a class="skip-link" href="#main" data-i18n="skip">Перейти до вмісту</a>

<!-- =============================================================== cursor -->
<div class="cursor" aria-hidden="true"><span class="cursor__label"></span></div>

<!-- ================================================================ frame -->
<header class="frame">
  <nav class="frame__tl" data-i18n-attr="aria-label:nav.primary" aria-label="Основна навігація">
    <a class="frame__link" href="index.html" data-i18n="nav.home">Головна</a>
  </nav>

  <a class="brandmark" href="index.html" aria-label="Nymphai Cosmetics">
    <svg class="brandmark__drop" viewBox="0 0 48 60" fill="none" aria-hidden="true">
      <path d="M24 3 C24 3 42 25.5 42 38 A18 18 0 0 1 6 38 C6 25.5 24 3 24 3 Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M15.5 44.5 V29.5 L32.5 44 V29" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="brandmark__word">nymphai</span>
    <span class="brandmark__sub">Cosmetics</span>
  </a>

  <nav class="frame__tr" data-i18n-attr="aria-label:nav.products" aria-label="Продукти">
    <a class="frame__link" href="products.html" data-i18n="nav.products">Продукти</a>
  </nav>

  <nav class="frame__bl" data-i18n-attr="aria-label:nav.brand" aria-label="Бренд">
    <a class="frame__link" href="brand.html" data-i18n="nav.brand">Бренд</a>
  </nav>

  <div class="frame__br">
    <a class="frame__link cart-link" href="cart.html" data-filled="false">
      <span data-i18n="nav.cart">Кошик</span>
      <span class="cart-link__count" aria-hidden="true"><span>0</span></span>
    </a>
    <span class="frame__divider" aria-hidden="true"></span>
    <div class="lang" role="group" data-i18n-attr="aria-label:nav.lang" aria-label="Мова">
      <button class="lang__btn" type="button" data-lang="uk" aria-pressed="true">UA</button>
      <button class="lang__btn" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<!-- =========================================================== scroll rail -->
<div class="rail" data-visible="false" aria-hidden="true">
  <span class="rail__value">0%</span>
  <span class="rail__ticks"></span>
</div>

<main id="main">
  <section class="page-top wrap">
    <p class="eyebrow page-top__eyebrow" data-i18n="contact.eyebrow">Контакти</p>
    <h1 class="headline" data-split data-reveal data-i18n="contact.title">Поговорімо</h1>
    <p class="lede page-top__lede" data-reveal data-i18n="contact.lede"></p>
  </section>

  <section class="wrap" style="padding-bottom:clamp(5rem,9vw,9rem)">
    <form class="form" data-contact-form novalidate>
      <div class="field">
        <label for="c-name" data-i18n="contact.name">Ім’я та прізвище</label>
        <input id="c-name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="c-email" data-i18n="contact.email">Email</label>
        <input id="c-email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="c-message" data-i18n="contact.message">Повідомлення</label>
        <textarea id="c-message" name="message" required></textarea>
      </div>
      <p><button class="btn btn--solid" type="submit"><span data-i18n="contact.send">Надіслати повідомлення</span></button></p>
    </form>
  </section>
</main>

<!-- ============================================================== footer -->
<footer class="site-footer" data-chrome="dark">
  <div class="wrap">
    <nav class="site-footer__nav" data-i18n-attr="aria-label:footer.nav" aria-label="Правова інформація">
      <a href="contact.html" data-i18n="footer.contacts">Контакти</a>
      <a href="returns.html" data-i18n="footer.returns">Повернення та відшкодування</a>
      <a href="terms.html" data-i18n="footer.terms">Умови та положення</a>
      <a href="privacy.html" data-i18n="footer.privacy">Політика приватності</a>
    </nav>
    <div class="site-footer__rule"></div>
    <p class="site-footer__legal" data-i18n="footer.legal">© 2026 Nymphai Cosmetics</p>
    <p class="site-footer__legal" data-i18n="footer.demo">Демонстраційна реконструкція.</p>
  </div>
</footer>

<script src="assets/js/core.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/chrome.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/preloader.js"></script>
<script src="assets/js/home.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
