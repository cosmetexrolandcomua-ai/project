<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 760" role="img" aria-label="VISO">
  <defs>
    <linearGradient id="body-siero" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#C9D3DC"/>
      <stop offset="0.42" stop-color="#C9D3DC"/>
      <stop offset="1" stop-color="#93A2AE"/>
    </linearGradient>
    <linearGradient id="cap-siero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="0.72" stop-color="#EFEFEF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#CFD3D6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gloss-siero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow-siero" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3A332A" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#3A332A" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: 'Jost', 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif; fill: #FFFFFF; text-anchor: middle; }
      .eyebrow { font-size: 25px; letter-spacing: 3px; font-weight: 300; }
      .name { font-size: 54px; letter-spacing: 4px; font-weight: 400; }
      .sub { font-size: 25px; font-style: italic; font-family: 'Cormorant Garamond', Georgia, serif; fill-opacity: 0.92; }
      .badge { font-size: 14px; letter-spacing: 1.6px; fill: #2E4356; font-weight: 500; }
      .a { font-size: 14px; letter-spacing: 1.8px; fill-opacity: 0.86; }
      .vol { font-size: 20px; letter-spacing: 1px; }
      .oz { font-size: 15px; letter-spacing: 1px; fill-opacity: 0.85; }
      .brand { font-size: 26px; letter-spacing: 0.4px; font-weight: 400; }
    </style>
  </defs>

  <ellipse cx="170" cy="741" rx="150" ry="19" fill="url(#shadow-siero)"/>

  <!-- pump actuator + cap -->
  <path d="M152 44h36a8 8 0 0 1 8 8v12h-52V52a8 8 0 0 1 8-8z" fill="#E9EBEC" fill-opacity="0.95"/>
  <rect x="104" y="62" width="132" height="126" rx="13" fill="url(#cap-siero)"/>
  <rect x="104" y="170" width="132" height="18" rx="9" fill="#D5D9DC" fill-opacity="0.85"/>
  <rect x="118" y="186" width="104" height="18" rx="6" fill="#C3C9CE" fill-opacity="0.9"/>

  <!-- body -->
  <rect x="66" y="200" width="208" height="536" rx="34" fill="url(#body-siero)"/>
  <rect x="84" y="214" width="26" height="508" rx="13" fill="url(#gloss-siero)" opacity="0.55"/>
  <rect x="238" y="214" width="14" height="508" rx="7" fill="#1F2A33" opacity="0.07"/>

  <!-- label -->
  <g transform="translate(0,-6)">
    <path d="M107 300 l14-22 14 22z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.9"/>
    <text x="184" y="302" class="eyebrow">SIERO</text>
    <text x="170" y="358" class="name">VISO</text>
    <text x="170" y="398" class="sub">Dafne</text>
    <rect x="74" y="420" width="192" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="170" y="442" class="badge">CON LATTE D'ASINA</text>
    <text x="170" y="492" class="a">ILLUMINANTE</text>
    <text x="170" y="578" class="vol">30ml ℮</text>
    <text x="170" y="602" class="oz">1.01 fl.oz</text>
    <rect x="96" y="640" width="148" height="46" rx="23" fill="#2E4356"/>
    <text x="170" y="671" class="brand">nymphai</text>
  </g>
</svg>
