      <stop offset="0.55" stop-color="#CBB89C"/>
      <stop offset="1" stop-color="#E6D8C1" stop-opacity="0.72"/>
    </linearGradient>
    
    <filter id="grain-trav" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer>
    </filter>
  </defs>

