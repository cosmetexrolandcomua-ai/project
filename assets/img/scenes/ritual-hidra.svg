<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" role="img" aria-label="Nymphai skincare ritual">
  <defs>
    <linearGradient id="rb-hid" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#33584A"/>
      <stop offset="0.62" stop-color="#12291F"/>
      <stop offset="1" stop-color="#33584A"/>
    </linearGradient>
    <linearGradient id="rs-hid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7E2D4" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#E7E2D4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E7E2D4" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="rk-hid" cx="0.34" cy="0.22" r="0.66">
      <stop offset="0" stop-color="#CFE4CF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#CFE4CF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rv-hid" cx="0.5" cy="0.44" r="0.78">
      <stop offset="0.48" stop-color="#07150F" stop-opacity="0"/>
      <stop offset="1" stop-color="#07150F" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="rblur-hid"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="rsoft-hid"><feGaussianBlur stdDeviation="9"/></filter>
    
    <filter id="rg-hid" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1000" height="1400" fill="url(#rb-hid)"/>

  <!-- raking light through a window -->
  <g filter="url(#rblur-hid)" opacity="0.5">
    <path d="M-200 140 L550 -70 L950 700 L150 1092Z" fill="#CFE4CF" fill-opacity="0.3"/>
    <path d="M100 868 L1100 420 L1200 1330 L300 1540.0000000000002Z" fill="#07150F" fill-opacity="0.22"/>
  </g>

  <circle cx="197" cy="1387" r="151" fill="#FFFFFF" fill-opacity="0.107"/><circle cx="754" cy="373" r="177" fill="#FFFFFF" fill-opacity="0.059"/><circle cx="213" cy="276" r="193" fill="#FFFFFF" fill-opacity="0.094"/><circle cx="1031" cy="680" r="144" fill="#FFFFFF" fill-opacity="0.043"/><circle cx="79" cy="1124" r="56" fill="#FFFFFF" fill-opacity="0.073"/><circle cx="580" cy="1311" r="176" fill="#FFFFFF" fill-opacity="0.069"/><circle cx="400" cy="-9" r="105" fill="#FFFFFF" fill-opacity="0.117"/><circle cx="1027" cy="-80" r="108" fill="#FFFFFF" fill-opacity="0.087"/><circle cx="268" cy="1477" r="127" fill="#FFFFFF" fill-opacity="0.075"/><circle cx="440" cy="-123" r="55" fill="#FFFFFF" fill-opacity="0.113"/><circle cx="461" cy="1346" r="173" fill="#FFFFFF" fill-opacity="0.126"/><circle cx="616" cy="93" r="141" fill="#FFFFFF" fill-opacity="0.125"/><circle cx="1019" cy="1181" r="157" fill="#FFFFFF" fill-opacity="0.048"/><circle cx="336" cy="56" r="54" fill="#FFFFFF" fill-opacity="0.088"/>

  <!-- folded silk, kept low and soft so it never reads as a figure -->
  <path d="M-40 1512 C 100 1204, 340 1106, 580 1162
           C 820 1218, 980 1316, 1040 1260
           L 1040 1440 L -40 1440Z"
        fill="url(#rs-hid)" opacity="0.8" filter="url(#rsoft-hid)"/>

  <!-- a single brushed swipe of cream, the signature of every Nymphai frame -->
  <g filter="url(#rsoft-hid)" opacity="0.72">
    <path d="M340 630 q140 -63 300 -8.4
             q-100 77 -310 36.4Z" fill="#FFFFFF" fill-opacity="0.8"/>
    <path d="M380 714 q120 -39.2 220 8.4"
          stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <rect width="1000" height="1400" fill="url(#rk-hid)"/>
  <rect width="1000" height="1400" fill="url(#rv-hid)"/>
  <rect width="1000" height="1400" filter="url(#rg-hid)" opacity="0.5"/>
</svg>
