<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-label="Nymphai still life">
  <defs>
    <linearGradient id="bg-emer" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1F4436"/>
      <stop offset="1" stop-color="#0F281F"/>
    </linearGradient>
    <radialGradient id="key-emer" cx="0.34" cy="0.26" r="0.72">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
