        fill="#FFFFFF" fill-opacity="0.46" transform="rotate(-17 399 593)"/><ellipse cx="206" cy="132" rx="150" ry="79"
        fill="#D8CDB9" fill-opacity="0.44" transform="rotate(-26 206 132)"/><ellipse cx="130" cy="250" rx="174" ry="95"
        fill="#FFFFFF" fill-opacity="0.49" transform="rotate(-41 130 250)"/><ellipse cx="430" cy="484" rx="188" ry="202"
        fill="#D8CDB9" fill-opacity="0.47" transform="rotate(21 430 484)"/></g>
  <rect width="1200" height="900" filter="url(#sg-milk)" opacity="0.55"/>
