<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Texture">
  <defs>
    <linearGradient id="sw-milk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2EDE3"/>
      <stop offset="1" stop-color="#D8CDB9"/>
    </linearGradient>
    <filter id="soft-milk"><feGaussianBlur stdDeviation="14"/></filter>
    
    <filter id="sg-milk" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#sw-milk)"/>
  <g filter="url(#soft-milk)"><ellipse cx="291" cy="738" rx="200" ry="121"
        fill="#D8CDB9" fill-opacity="0.45" transform="rotate(-15 291 738)"/><ellipse cx="806" cy="193" rx="127" ry="165"
        fill="#FFFFFF" fill-opacity="0.39" transform="rotate(-11 806 193)"/><ellipse cx="265" cy="59" rx="303" ry="145"
        fill="#D8CDB9" fill-opacity="0.33" transform="rotate(6 265 59)"/><ellipse cx="552" cy="648" rx="156" ry="89"
        fill="#FFFFFF" fill-opacity="0.48" transform="rotate(-3 552 648)"/><ellipse cx="10" cy="699" rx="131" ry="181"
