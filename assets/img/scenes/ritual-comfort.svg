<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" role="img" aria-label="Nymphai skincare ritual">
  <defs>
    <linearGradient id="rb-comf" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#E4D3B8"/>
      <stop offset="0.62" stop-color="#8A7051"/>
      <stop offset="1" stop-color="#E4D3B8"/>
    </linearGradient>
    <linearGradient id="rs-comf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F2E8" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#F7F2E8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F7F2E8" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="rk-comf" cx="0.34" cy="0.22" r="0.66">
      <stop offset="0" stop-color="#FFF6E4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFF6E4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rv-comf" cx="0.5" cy="0.44" r="0.78">
      <stop offset="0.48" stop-color="#2A241B" stop-opacity="0"/>
      <stop offset="1" stop-color="#2A241B" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="rblur-comf"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="rsoft-comf"><feGaussianBlur stdDeviation="9"/></filter>
    
    <filter id="rg-comf" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1000" height="1400" fill="url(#rb-comf)"/>

  <!-- raking light through a window -->
  <g filter="url(#rblur-comf)" opacity="0.5">
    <path d="M-200 140 L550 -70 L950 700 L150 1092Z" fill="#FFF6E4" fill-opacity="0.3"/>
    <path d="M100 868 L1100 420 L1200 1330 L300 1540.0000000000002Z" fill="#2A241B" fill-opacity="0.22"/>
  </g>

  <circle cx="189" cy="477" r="55" fill="#FFFFFF" fill-opacity="0.050"/><circle cx="358" cy="858" r="127" fill="#FFFFFF" fill-opacity="0.097"/><circle cx="635" cy="316" r="86" fill="#FFFFFF" fill-opacity="0.126"/><circle cx="303" cy="376" r="162" fill="#FFFFFF" fill-opacity="0.050"/><circle cx="555" cy="690" r="195" fill="#FFFFFF" fill-opacity="0.066"/><circle cx="881" cy="357" r="116" fill="#FFFFFF" fill-opacity="0.050"/><circle cx="405" cy="813" r="76" fill="#FFFFFF" fill-opacity="0.114"/><circle cx="106" cy="769" r="109" fill="#FFFFFF" fill-opacity="0.120"/><circle cx="1017" cy="958" r="164" fill="#FFFFFF" fill-opacity="0.103"/><circle cx="966" cy="-79" r="164" fill="#FFFFFF" fill-opacity="0.069"/><circle cx="-82" cy="1138" r="97" fill="#FFFFFF" fill-opacity="0.085"/><circle cx="295" cy="118" r="179" fill="#FFFFFF" fill-opacity="0.070"/><circle cx="942" cy="1148" r="117" fill="#FFFFFF" fill-opacity="0.083"/><circle cx="507" cy="1252" r="133" fill="#FFFFFF" fill-opacity="0.089"/>

  <!-- folded silk, kept low and soft so it never reads as a figure -->
  <path d="M-40 1512 C 100 1204, 340 1106, 580 1162
           C 820 1218, 980 1316, 1040 1260
           L 1040 1440 L -40 1440Z"
        fill="url(#rs-comf)" opacity="0.8" filter="url(#rsoft-comf)"/>

  <!-- a single brushed swipe of cream, the signature of every Nymphai frame -->
  <g filter="url(#rsoft-comf)" opacity="0.72">
    <path d="M340 630 q140 -63 300 -8.4
             q-100 77 -310 36.4Z" fill="#FFFFFF" fill-opacity="0.8"/>
    <path d="M380 714 q120 -39.2 220 8.4"
          stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <rect width="1000" height="1400" fill="url(#rk-comf)"/>
  <rect width="1000" height="1400" fill="url(#rv-comf)"/>
  <rect width="1000" height="1400" filter="url(#rg-comf)" opacity="0.5"/>
</svg>
