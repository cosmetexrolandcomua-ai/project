<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Texture">
  <defs>
    <linearGradient id="sw-cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F1E6"/>
      <stop offset="1" stop-color="#DED3C0"/>
    </linearGradient>
    <filter id="soft-cream"><feGaussianBlur stdDeviation="14"/></filter>
    
    <filter id="sg-cream" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#sw-cream)"/>
  <g filter="url(#soft-cream)"><path d="M-20 63 C 300 26, 660 100, 1220 48"
        stroke="#DED3C0" stroke-opacity="0.56" stroke-width="49" fill="none" stroke-linecap="round"/><path d="M-20 167 C 300 102, 660 233, 1220 141"
        stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="55" fill="none" stroke-linecap="round"/><path d="M-20 272 C 300 223, 660 321, 1220 253"
        stroke="#DED3C0" stroke-opacity="0.38" stroke-width="40" fill="none" stroke-linecap="round"/><path d="M-20 377 C 300 311, 660 443, 1220 350"
        stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="45" fill="none" stroke-linecap="round"/><path d="M-20 481 C 300 432, 660 530, 1220 462"
        stroke="#DED3C0" stroke-opacity="0.53" stroke-width="45" fill="none" stroke-linecap="round"/><path d="M-20 586 C 300 521, 660 651, 1220 560"
        stroke="#FFFFFF" stroke-opacity="0.47" stroke-width="56" fill="none" stroke-linecap="round"/><path d="M-20 691 C 300 624, 660 757, 1220 664"
        stroke="#DED3C0" stroke-opacity="0.33" stroke-width="83" fill="none" stroke-linecap="round"/><path d="M-20 795 C 300 753, 660 838, 1220 778"
        stroke="#FFFFFF" stroke-opacity="0.56" stroke-width="66" fill="none" stroke-linecap="round"/></g>
  <rect width="1200" height="900" filter="url(#sg-cream)" opacity="0.55"/>
</svg>
