<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Texture">
  <defs>
    <linearGradient id="sw-stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCCFB8"/>
      <stop offset="1" stop-color="#B9A88C"/>
    </linearGradient>
    <filter id="soft-stone"><feGaussianBlur stdDeviation="14"/></filter>
    
    <filter id="sg-stone" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#sw-stone)"/>
