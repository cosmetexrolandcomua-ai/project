<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" role="img" aria-label="Nymphai skincare ritual">
  <defs>
    <linearGradient id="rb-sier" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#D2DEE4"/>
      <stop offset="0.62" stop-color="#6E8794"/>
      <stop offset="1" stop-color="#D2DEE4"/>
    </linearGradient>
    <linearGradient id="rs-sier" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F4ED" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#F7F4ED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F7F4ED" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="rk-sier" cx="0.34" cy="0.22" r="0.66">
      <stop offset="0" stop-color="#FAFDFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FAFDFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rv-sier" cx="0.5" cy="0.44" r="0.78">
      <stop offset="0.48" stop-color="#16232B" stop-opacity="0"/>
      <stop offset="1" stop-color="#16232B" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="rblur-sier"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="rsoft-sier"><feGaussianBlur stdDeviation="9"/></filter>
    
    <filter id="rg-sier" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1000" height="1400" fill="url(#rb-sier)"/>

  <!-- raking light through a window -->
  <g filter="url(#rblur-sier)" opacity="0.5">
    <path d="M-200 140 L550 -70 L950 700 L150 1092Z" fill="#FAFDFF" fill-opacity="0.3"/>
    <path d="M100 868 L1100 420 L1200 1330 L300 1540.0000000000002Z" fill="#16232B" fill-opacity="0.22"/>
  </g>

  <circle cx="202" cy="1536" r="184" fill="#FFFFFF" fill-opacity="0.057"/><circle cx="751" cy="327" r="52" fill="#FFFFFF" fill-opacity="0.058"/><circle cx="338" cy="1434" r="110" fill="#FFFFFF" fill-opacity="0.113"/><circle cx="698" cy="1388" r="105" fill="#FFFFFF" fill-opacity="0.096"/><circle cx="1084" cy="1431" r="144" fill="#FFFFFF" fill-opacity="0.040"/><circle cx="931" cy="898" r="182" fill="#FFFFFF" fill-opacity="0.057"/><circle cx="891" cy="498" r="133" fill="#FFFFFF" fill-opacity="0.046"/><circle cx="688" cy="605" r="115" fill="#FFFFFF" fill-opacity="0.074"/><circle cx="940" cy="261" r="93" fill="#FFFFFF" fill-opacity="0.081"/><circle cx="775" cy="1329" r="172" fill="#FFFFFF" fill-opacity="0.091"/><circle cx="209" cy="801" r="131" fill="#FFFFFF" fill-opacity="0.097"/><circle cx="912" cy="75" r="106" fill="#FFFFFF" fill-opacity="0.117"/><circle cx="508" cy="-81" r="54" fill="#FFFFFF" fill-opacity="0.077"/><circle cx="1062" cy="694" r="131" fill="#FFFFFF" fill-opacity="0.082"/>

  <!-- folded silk, kept low and soft so it never reads as a figure -->
  <path d="M-40 1512 C 100 1204, 340 1106, 580 1162
           C 820 1218, 980 1316, 1040 1260
           L 1040 1440 L -40 1440Z"
        fill="url(#rs-sier)" opacity="0.8" filter="url(#rsoft-sier)"/>

  <!-- a single brushed swipe of cream, the signature of every Nymphai frame -->
  <g filter="url(#rsoft-sier)" opacity="0.72">
    <path d="M340 630 q140 -63 300 -8.4
             q-100 77 -310 36.4Z" fill="#FFFFFF" fill-opacity="0.8"/>
    <path d="M380 714 q120 -39.2 220 8.4"
          stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <rect width="1000" height="1400" fill="url(#rk-sier)"/>
  <rect width="1000" height="1400" fill="url(#rv-sier)"/>
  <rect width="1000" height="1400" filter="url(#rg-sier)" opacity="0.5"/>
</svg>
