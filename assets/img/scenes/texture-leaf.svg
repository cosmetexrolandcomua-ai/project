<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Texture">
  <defs>
    <linearGradient id="sw-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27503E"/>
      <stop offset="1" stop-color="#12291F"/>
    </linearGradient>
    <filter id="soft-leaf"><feGaussianBlur stdDeviation="14"/></filter>
    
    <filter id="sg-leaf" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#sw-leaf)"/>
  <g filter="url(#soft-leaf)"><ellipse cx="298" cy="81" rx="101" ry="209"
        fill="#12291F" fill-opacity="0.25" transform="rotate(27 298 81)"/><ellipse cx="847" cy="37" rx="157" ry="132"
        fill="#4A7C62" fill-opacity="0.50" transform="rotate(42 847 37)"/><ellipse cx="1076" cy="352" rx="110" ry="234"
        fill="#12291F" fill-opacity="0.38" transform="rotate(25 1076 352)"/><ellipse cx="768" cy="121" rx="318" ry="238"
        fill="#4A7C62" fill-opacity="0.29" transform="rotate(-3 768 121)"/><ellipse cx="782" cy="865" rx="225" ry="137"
        fill="#12291F" fill-opacity="0.41" transform="rotate(-21 782 865)"/><ellipse cx="671" cy="748" rx="146" ry="100"
        fill="#4A7C62" fill-opacity="0.33" transform="rotate(-24 671 748)"/><ellipse cx="196" cy="589" rx="289" ry="88"
        fill="#12291F" fill-opacity="0.52" transform="rotate(15 196 589)"/><ellipse cx="1131" cy="62" rx="283" ry="93"
        fill="#4A7C62" fill-opacity="0.36" transform="rotate(-6 1131 62)"/></g>
  <rect width="1200" height="900" filter="url(#sg-leaf)" opacity="0.55"/>
</svg>
